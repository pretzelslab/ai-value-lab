[project]
name = "ai-value-lab"
version = "0.1.0"
description = "A hands-on lab for testing the economics and realized value of enterprise AI use cases."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "streamlit>=1.60,<2",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.4,<5",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
live = [
  "anthropic>=0.40,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_value_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
